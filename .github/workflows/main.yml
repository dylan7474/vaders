name: Invaders Game

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libfftw3-dev libsdl2-mixer-dev

      - name: Build the project
        run: make

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaders
          path: mgen
